{% extends "base.html" %}
{% block title %}Students{% endblock %}
{% block content %}
<div class="page-header">
    <div><p class="eyebrow">STUDENT MANAGEMENT</p><h1>Students</h1><p>View students registered in the ERP.</p></div>
</div>
<div class="panel table-responsive">
<table class="table align-middle mb-0">
<thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
<tbody>
{% for student in students %}
<tr><td><strong>{{ student.name }}</strong></td><td>{{ student.email }}</td><td><span class="badge-soft">Student</span></td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
